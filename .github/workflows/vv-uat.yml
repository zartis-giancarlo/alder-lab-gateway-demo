name: vv-uat

# No path filter, no branch filter and no commit-message skip on purpose:
# a workflow skipped as a whole leaves its required check "Pending" and blocks the merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  vv-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Playwright tests
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
